<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff2f5">
  <meta name="description" content="도미애 전용, 언제든 열어보는 엄마의 소원상자">
  <title>엄마의 소원상자 🎀</title>
  <style>
    :root{--bg:#fff9fa;--pink:#fff0f4;--pink2:#ffe2ea;--ink:#8d4261;--ink2:#a16d81;--strong:#583d49;--line:#f4dfe7;--shadow:0 18px 52px rgba(133,63,91,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(circle at 7% 0%,#ffeaf1 0,transparent 34%),radial-gradient(circle at 97% 20%,#ffedf2 0,transparent 28%),var(--bg);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;color:var(--strong);-webkit-font-smoothing:antialiased}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #e79bb7;outline-offset:3px}img,video{max-width:100%}
    .app{max-width:690px;margin:0 auto;padding:20px 16px calc(42px + env(safe-area-inset-bottom))}
    .shell{background:#fff1f4;border:1px solid #ffedf0;border-radius:32px;padding:24px;box-shadow:var(--shadow)}
    .meta,.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .meta{margin-bottom:15px;font-size:12px;color:#a27186}
    .badge{display:inline-flex;align-items:center;gap:5px;background:#fff9fb;color:#96556f;border:1px solid #f4d9e3;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap}
    .hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    .hero-title{font-size:clamp(27px,6vw,36px);font-weight:850;line-height:1.22;color:var(--ink);letter-spacing:-1.3px;margin:0 0 11px}
    .hero-sub{font-size:14px;line-height:1.65;color:#986d7f;margin:0}
    .mom-sticker{height:132px;width:132px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 12px 10px rgba(167,89,118,.13));animation:float 4.5s ease-in-out infinite}
    .paper{background:#fff;border-radius:26px;padding:23px 18px}.center{text-align:center}
    h1,h2,h3,p{margin-top:0}
    .section-title{font-size:clamp(21px,5vw,26px);color:var(--ink);letter-spacing:-.7px;margin:0 0 7px;font-weight:800}
    .muted{color:var(--ink2);line-height:1.65;font-size:14px}.small{font-size:12px}.tiny{font-size:11px}
    .menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
    .menu-tile{min-height:76px;background:var(--pink);color:var(--ink);border:1px solid transparent;border-radius:21px;display:flex;gap:9px;align-items:center;justify-content:center;font-size:19px;font-weight:800;transition:transform .2s,background .2s,box-shadow .2s}
    .menu-tile:hover{background:#ffe3ec;box-shadow:0 8px 20px #fbd2df}.menu-tile:active,.choice:active,.btn:active{transform:scale(.97)}
    .menu-emoji{font-size:25px}.footer-caption{text-align:center;font-size:12px;color:#a77b8b;margin:20px 0 3px}
    .home-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
    .soft-action{border:1px solid #f2d9e2;color:#965a71;border-radius:14px;background:#fff9fb;padding:12px;font-size:13px;font-weight:750}
    .page-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px;gap:12px}
    .back{background:transparent;border:none;color:#9c6279;font-size:14px;font-weight:750;padding:10px 0}
    .page-panel{background:#fff;border-radius:25px;padding:23px 19px}
    .page-title{font-size:25px;letter-spacing:-.8px;line-height:1.3;color:var(--ink);font-weight:850;margin:0 0 8px}
    .page-description{font-size:14px;color:#9f7686;line-height:1.7;margin-bottom:20px}
    .choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .choice{min-height:91px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff5f7;border:1px solid #f9e2eb;border-radius:18px;color:var(--ink);padding:13px 10px;text-align:center;transition:.2s}
    .choice:hover{background:#ffeaf0;transform:translateY(-2px)}.choice .big{font-size:34px;line-height:1.15}
    .choice b{font-size:16px}.choice span.note{font-size:12px;color:#ad8092;font-weight:500}
    .btn{background:#a44f70;border:1px solid #a44f70;border-radius:15px;padding:15px 19px;color:#fff;font-weight:800;font-size:15px;min-height:52px;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 18px rgba(164,79,112,.2)}
    .btn:hover{box-shadow:0 11px 24px rgba(164,79,112,.26)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid #ebcdd9;box-shadow:none}
    .btn.pale{background:#fff0f4;color:var(--ink);border:1px solid #f4d6e2;box-shadow:none}
    .btn.danger{background:#b95f6e;border-color:#b95f6e;color:#fff;box-shadow:none}
    .btn.text-danger{background:transparent;border:1px solid #f2d9df;color:#ad6a79;box-shadow:none}
    .btn-row{display:flex;gap:10px;margin-top:19px;flex-wrap:wrap}.btn-row .btn{flex:1}.btn.wide{width:100%;margin-top:18px}
    .top-label{font-size:12px;font-weight:800;color:#b37690;letter-spacing:1px;margin-bottom:9px}
    .result-card{background:linear-gradient(145deg,#fffafb,#fff0f4);border-radius:23px;border:1px solid #f6dce6;padding:22px 15px;text-align:center}
    .result-emoji{font-size:68px;line-height:1.2;display:block;filter:drop-shadow(0 9px 8px rgba(180,98,130,.12))}
    .result-title{font-size:23px;color:var(--ink);font-weight:850;letter-spacing:-.6px;line-height:1.35;margin:16px 0 7px}
    .result-text{font-size:15px;line-height:1.65;color:#996879;margin:0}
    .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
    .confetti{position:absolute;top:-20px;font-size:24px;animation:fall var(--duration) linear forwards}
    .pop{animation:pop .46s cubic-bezier(.19,1.1,.37,1) both}.rise{animation:rise .42s ease-out both}
    .card-line{height:1px;background:#f2dbe4;margin:16px 0}
    .bank{background:linear-gradient(145deg,#f4faf7,#e7f4ef);border-radius:22px;padding:22px;color:#255846;margin-top:12px;text-align:left}
    .bank-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}
    .bank-badge{font-size:11px;background:#d9ede4;border-radius:999px;padding:6px 9px;color:#42836b}
    .bank-label{font-size:13px;color:#648c7b;margin-bottom:7px}
    .balance{font-size:clamp(28px,7vw,37px);font-weight:850;letter-spacing:-1.3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    .deposit{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px}.deposit strong{color:#18845d;font-size:21px}
    .luxury-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .luxury-choice{background:#fff9fa;border:1px solid #f3e1e7;border-radius:18px;overflow:hidden;text-align:left;padding:0;color:var(--strong)}
    .luxury-photo{height:120px;background:#f7f0ec;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
    .luxury-photo img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
    .luxury-photo .photo-fallback{display:none;font-size:56px}
    .luxury-name{font-size:13px;font-weight:800;padding:12px 12px 2px}
    .luxury-model{font-size:11px;color:#a17e8c;padding:0 12px 13px;min-height:31px}
    .gift-box{width:205px;height:175px;position:relative;margin:35px auto 27px;cursor:pointer;filter:drop-shadow(0 15px 16px #e6a7b7)}
    .gift-box .lid{position:absolute;z-index:2;left:6px;top:17px;width:193px;height:45px;background:linear-gradient(135deg,#ed94b2,#d16b92);border-radius:10px;transform:rotate(-5deg);border:5px solid #fff0f4}
    .gift-box .base{position:absolute;left:19px;top:53px;width:168px;height:120px;background:linear-gradient(135deg,#f9b4cc,#e785a9);border-radius:9px}
    .gift-box .ribbon{position:absolute;left:86px;top:5px;z-index:4;width:30px;height:165px;background:#fff1c8;transform:rotate(-5deg);border-radius:5px}
    .gift-box .bow{position:absolute;z-index:5;top:-12px;left:65px;font-size:70px}
    .gift-box.opening .lid{animation:openlid 1.1s forwards}
    .product-hero{min-height:260px;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#fffdf9,#f9f0ea);border:1px solid #f7e7df;border-radius:22px;padding:18px;overflow:hidden;position:relative}
    .product-hero img{width:100%;height:270px;object-fit:contain;mix-blend-mode:multiply}
    .product-hero .photo-fallback{display:none;font-size:95px}
    .destinations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .destination{border:1px solid #e9d7df;background:#fff9fb;border-radius:20px;min-height:128px;color:var(--ink);text-align:center;padding:15px}
    .destination .flag{font-size:40px;display:block;margin-bottom:7px}.destination .city{font-weight:850;font-size:17px}.destination .tag{font-size:12px;color:#b58b9c;margin-top:4px}
    .ticket{background:white;border-radius:21px;overflow:hidden;box-shadow:0 8px 30px #e7cbd5;border:1px solid #f2d6e0}
    .ticket-top{background:#fdebf0;padding:16px 19px;display:flex;justify-content:space-between;align-items:center;color:#a05773;font-size:12px;font-weight:800}
    .ticket-body{padding:24px 19px}.ticket-airports{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .airport-code{font-size:40px;color:var(--ink);letter-spacing:-1px;font-weight:900}.airport-city{font-size:12px;color:#ac8393}
    .plane-line{flex:1;min-width:40px;position:relative;text-align:center;color:#c77c98;font-size:26px}
    .plane-line:before{content:"";position:absolute;height:1px;border-top:2px dashed #eac1d1;left:0;right:0;top:50%;z-index:0}.plane-line span{position:relative;background:#fff;padding:0 8px}
    .ticket-cut{position:relative;border-top:2px dashed #efd9e2;margin:22px 0}
    .ticket-cut:before,.ticket-cut:after{content:"";position:absolute;top:-12px;width:20px;height:20px;background:#fff0f4;border-radius:50%}
    .ticket-cut:before{left:-29px}.ticket-cut:after{right:-29px}
    .ticket-fields{display:grid;grid-template-columns:1fr 1fr;gap:17px 8px}
    .ticket-field label{display:block;color:#ae8a99;font-size:10px;letter-spacing:.8px;margin-bottom:4px}.ticket-field b{font-size:16px;color:#8d4962}
    .barcode{height:45px;margin-top:23px;opacity:.6;background:repeating-linear-gradient(90deg,#775b68 0 2px,transparent 2px 4px,#775b68 4px 5px,transparent 5px 9px,#775b68 9px 13px,transparent 13px 16px)}
    .ticket-note{text-align:center;color:#aa8391;font-size:11px;margin-top:10px}
    .sky{height:260px;border-radius:20px;background:linear-gradient(#90d7fc,#dff5ff 75%,#ffffff);position:relative;overflow:hidden;margin:10px 0 16px}
    .cloud{position:absolute;font-size:75px;opacity:.78;animation:cloud 3s linear infinite}.cloud.c1{left:3%;top:10%}.cloud.c2{left:64%;top:58%;animation-delay:-1.4s}
    .flying-plane{font-size:80px;position:absolute;top:29%;left:14%;animation:fly 2.6s ease-in forwards;transform-origin:center}
    .landmark-frame{height:270px;border-radius:19px;background:linear-gradient(145deg,#dcecff,#fce7f1);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    .landmark-frame img{height:100%;width:100%;object-fit:cover;position:absolute;inset:0}.landmark-fallback{font-size:80px}
    .place-dots{display:flex;justify-content:center;gap:8px;margin:14px 0}.place-dot{width:8px;height:8px;border-radius:99px;background:#ead1dc}.place-dot.active{width:21px;background:#b56483}
    .passport{padding:24px;background:linear-gradient(135deg,#fdf2e1,#ffe6db);border-radius:20px;text-align:center}
    .stamp{display:inline-grid;place-content:center;border:4px double #bb6c89;color:#b56181;border-radius:50%;height:155px;width:155px;font-weight:900;transform:rotate(-12deg);margin:10px}
    .memory-photo{max-height:400px;width:100%;border-radius:16px;object-fit:contain;background:#fff9f4;box-shadow:0 10px 22px #f1dce5}
    .memory-border{background:#fff;padding:14px 14px 30px;border:1px solid #f0e1e7;border-radius:8px;transform:rotate(-1deg);box-shadow:0 10px 22px #efdae2}
    .beauty-wrap{min-height:280px;border-radius:20px;background:radial-gradient(circle,#fff 0,#ffe6f0 70%);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .beauty-wrap img{max-width:85%;max-height:270px;object-fit:contain;z-index:2}.beauty-wrap .sparkle{position:absolute;font-size:37px;animation:twinkle 1.5s infinite alternate}
    .beauty-wrap:before{position:absolute;font-size:165px;line-height:1;opacity:.2;z-index:0;bottom:-23px}
    .beauty-wrap.beauty-princess{background:linear-gradient(145deg,#fff8fa,#ffd8e8 75%,#ffc3da)}
    .beauty-wrap.beauty-princess:before{content:"🏰";left:-14px}
    .beauty-wrap.beauty-queen{background:radial-gradient(circle at 50% 40%,#fff4c1 0,#e9bc6d 52%,#8a4762 100%);border:5px double #bb8c45}
    .beauty-wrap.beauty-queen:before{content:"♛";color:#764262;opacity:.35;right:-5px;bottom:-50px;font-size:240px}
    .beauty-wrap.beauty-star{background:radial-gradient(ellipse at 50% 0,#a65bd5 0,#5f346a 55%,#222039 100%)}
    .beauty-wrap.beauty-star:before{content:"★";color:#ffe98e;right:-12px;bottom:-25px;opacity:.35;font-size:220px}
    .beauty-wrap.beauty-princess img{transform:scale(.86) translateY(14px)}
    .beauty-wrap.beauty-queen img{filter:drop-shadow(0 0 16px #f9e39c);transform:scale(.92) translateY(10px)}
    .beauty-wrap.beauty-star img{filter:drop-shadow(0 0 18px #ffe5f7);transform:scale(.88) translateY(16px)}
    .beauty-scene-title{position:absolute;z-index:4;left:12px;right:12px;top:15px;text-align:center;border-radius:99px;background:rgba(255,255,255,.87);padding:7px;font-size:13px;color:#8d4261;font-weight:850}
    .beauty-wrap.beauty-queen .beauty-scene-title{color:#6c4320;background:#fff6d2}
    .beauty-wrap.beauty-star .beauty-scene-title{color:#fff;background:#9f4c99}
    .beauty-stage-prop{position:absolute;z-index:3;bottom:12px;left:12px;font-size:43px;filter:drop-shadow(0 5px 4px #a97c8c66);animation:float 3s ease-in-out infinite}
    .beauty-star .beauty-stage-prop{font-size:53px}
    .photo-stage{height:390px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(145deg,#dcecff,#ffe4eb);isolation:isolate}
    .photo-background{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#b9e3ff,#e6f1ff);overflow:hidden}
    .photo-background img{position:absolute;width:100%;height:100%;object-fit:cover;inset:0;z-index:1}
    .photo-background .landmark-fallback{font-size:100px}
    .photo-background:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(transparent 52%,rgba(36,26,44,.52))}
    .photo-sticker{position:absolute;z-index:3;bottom:44px;right:-7px;width:70%;max-height:78%;object-fit:contain;filter:drop-shadow(0 10px 9px rgba(36,22,38,.35))}
    .photo-caption{position:absolute;z-index:4;bottom:15px;left:13px;right:13px;color:#fff;text-shadow:0 2px 7px rgba(20,13,31,.8);font-size:18px;font-weight:850;letter-spacing:.3px}
    .photo-flash{position:absolute;inset:0;z-index:10;background:#fff;opacity:0;pointer-events:none}
    .photo-flash.active{animation:shutter .55s ease-out}
    .shutter-button{font-size:20px;border-radius:99px;width:84px;height:84px;border:8px solid #f5d5e0;background:#a45172;color:#fff;display:block;margin:20px auto 5px;box-shadow:0 8px 22px #d6a6b7}
    .photo-output{display:block;width:100%;border-radius:17px;box-shadow:0 11px 32px #dcb6c3;max-height:560px;object-fit:contain;background:#fff}
    @keyframes shutter{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
    .meter{height:25px;background:#fce0e9;border-radius:999px;overflow:hidden;margin:24px 0 16px}.meter-fill{height:100%;background:linear-gradient(90deg,#ffb6cf,#d26491);width:0;transition:width .45s;border-radius:999px}
    .heart-tap{height:138px;width:138px;border:none;border-radius:100%;background:#fff0f5;box-shadow:0 0 0 12px #ffedf3,inset 0 3px 10px #fff;display:block;margin:24px auto;color:#e878a1;font-size:67px;transition:transform .16s}.heart-tap:active{transform:scale(.9)}
    .comfort-cloud{font-size:100px;text-align:center;margin:15px 0;animation:float 3s ease-in-out infinite}
    .scratch-wrap{height:180px;position:relative;border-radius:20px;overflow:hidden;margin:18px 0;touch-action:none;border:3px solid #f5d6a5;background:#fff0cb}
    .scratch-prize{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#875e32;gap:7px}.scratch-prize .emoji{font-size:60px}.scratch-prize b{font-size:20px}
    .scratch-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
    .gift-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .gift-card{background:#fff6f8;border:1px solid #f4dfe6;padding:16px 12px;border-radius:17px;text-align:center}
    .gift-card .emoji{font-size:40px;display:block;margin-bottom:5px}.gift-card b{color:#8f4a65;font-size:14px}.gift-card small{color:#af8798;display:block;margin-top:5px;line-height:1.5}
    .photo-triptych{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:20px 0}.photo-triptych img{height:160px;width:100%;object-fit:cover;border-radius:12px}
    .letter{padding:24px 17px;background:linear-gradient(#fffdf8,#fff7f7);border:1px solid #f1e0df;border-radius:20px;color:#805363;line-height:2;text-align:center;font-size:15px}
    .letter p{margin:0 0 11px}.letter p:last-child{margin-bottom:0}.video{width:100%;border-radius:14px;background:#2b1b20;margin-top:13px}
    .toast{position:fixed;z-index:100;bottom:calc(25px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:#775065;color:#fff;padding:12px 18px;border-radius:99px;box-shadow:0 9px 28px #a56d84;opacity:0;transition:.25s;max-width:90%;font-size:13px;font-weight:750;text-align:center;pointer-events:none}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes float{50%{transform:translateY(-7px)}}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pop{0%{opacity:0;transform:scale(.72)}75%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
    @keyframes fall{to{transform:translate(var(--drift),105vh) rotate(600deg);opacity:0}}@keyframes openlid{to{transform:translateY(-105px) rotate(-19deg);opacity:0}}
    @keyframes fly{0%{transform:translate(-80px,55px) rotate(-20deg)}60%{transform:translate(95px,-45px) rotate(-15deg)}100%{transform:translate(480px,-130px) rotate(-14deg)}}
    @keyframes cloud{from{transform:translateX(-120px)}to{transform:translateX(400px)}}@keyframes twinkle{to{transform:scale(1.5) rotate(20deg);opacity:.35}}
    @media(max-width:430px){.app{padding:12px 10px 30px}.shell{padding:18px 15px;border-radius:25px}.hero-title{font-size:28px}.mom-sticker{width:100px;height:105px}.hero-sub{font-size:12px}.paper{padding:20px 13px}.menu-tile{min-height:76px;font-size:17px;gap:5px}.menu-emoji{font-size:23px}.page-panel{padding:20px 14px}.choice-grid,.luxury-grid,.destinations{gap:9px}.choice{min-height:86px}.luxury-photo{height:115px}.photo-triptych img{height:115px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>
  <div id="confetti" class="confetti-layer" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status"></div>
  <script>

    async function loadLandmarkImage(place,targetId='landmark-photo'){
      const key=place.wiki,box=document.getElementById(targetId);
      if(!box||box.dataset.wiki!==key)return;
      const cached=loadLandmarkImage.cache||(loadLandmarkImage.cache={});
      let url=place.image||cached[key];
      if(!url){
        try{
          const api='https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&titles='+
            encodeURIComponent(key.replaceAll('_',' '))+'&piprop=thumbnail&pithumbsize=1000&format=json&origin=*';
          const response=await fetch(api);
          if(!response.ok)throw new Error('image');
          const obj=await response.json(),pages=obj.query&&obj.query.pages;
          const page=pages&&Object.values(pages)[0];
          url=page&&page.thumbnail&&page.thumbnail.source;
          if(url)cached[key]=url;
        }catch(e){}
      }
      if(url){
        const current=document.getElementById(targetId);
        if(current&&current.dataset.wiki===key){
          const img=document.createElement('img');
          img.alt=place.name+' 실제 사진';
          img.loading='lazy';
          if(targetId==='photo-background'&&!url.startsWith('data:'))img.crossOrigin='anonymous';
          img.src=url;
          img.onerror=()=>img.remove();
          current.appendChild(img);
        }
      }
    }
    function makeTravelPhoto(d,p,background,avatar,useBackground){
      const canvas=document.createElement('canvas');
      canvas.width=960;canvas.height=1280;
      const c=canvas.getContext('2d');
      if(!c)throw new Error('canvas unavailable');
      const x=42,y=42,w=876,h=1060;
      c.fillStyle='#fff8fa';c.fillRect(0,0,960,1280);
      c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
      if(useBackground&&background&&background.complete&&background.naturalWidth>0){
        const s=Math.max(w/background.naturalWidth,h/background.naturalHeight);
        const rw=background.naturalWidth*s,rh=background.naturalHeight*s;
        c.drawImage(background,x+(w-rw)/2,y+(h-rh)/2,rw,rh);
      }else{
        const g=c.createLinearGradient(0,y,0,y+h);
        g.addColorStop(0,'#8cc7ed');g.addColorStop(.7,'#ffdeee');g.addColorStop(1,'#c38eab');
        c.fillStyle=g;c.fillRect(x,y,w,h);
        c.textAlign='center';c.font='170px sans-serif';c.fillText(p.emoji,x+w/2,y+390);
        c.font='bold 55px sans-serif';c.fillStyle='#754d66';c.fillText(p.name,x+w/2,y+495);
      }
      const shade=c.createLinearGradient(0,y+450,0,y+h);
      shade.addColorStop(0,'rgba(35,20,40,0)');shade.addColorStop(1,'rgba(35,20,40,.63)');
      c.fillStyle=shade;c.fillRect(x,y,w,h);
      if(avatar&&avatar.complete&&avatar.naturalWidth>0){
        const aw=530,ah=aw*(avatar.naturalHeight/avatar.naturalWidth);
        c.shadowColor='rgba(30,20,35,.34)';c.shadowBlur=25;c.shadowOffsetY=12;
        c.drawImage(avatar,x+w-aw+32,y+h-ah-45,aw,ah);
        c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetY=0;
      }
      c.textAlign='left';c.fillStyle='#fff';c.font='bold 44px sans-serif';
      c.shadowColor='rgba(30,20,35,.6)';c.shadowBlur=10;
      c.fillText('📍 도미애 in '+d.city,x+35,y+h-62);
      c.shadowBlur=0;
      c.restore();
      c.fillStyle='#965b75';c.font='bold 31px sans-serif';c.fillText('엄마의 소원상자 🎀',45,1160);
      c.font='22px sans-serif';c.fillStyle='#ad8092';c.fillText(p.name+' · 가상 여행 기념사진',45,1207);
      if(p.credit){c.font='16px sans-serif';c.fillStyle='#b891a0';c.fillText('Lahaina / Wikimedia Commons · CC BY-SA 4.0',45,1245)}
      return canvas.toDataURL('image/jpeg',.87);
    }

    function setupScratch(){
      const canvas=document.getElementById('scratch-canvas');
      if(!canvas)return;
      const rect=canvas.getBoundingClientRect(),pixelRatio=Math.min(window.devicePixelRatio||1,2);
      canvas.width=Math.round(rect.width*pixelRatio);canvas.height=Math.round(rect.height*pixelRatio);
      const ctx=canvas.getContext('2d');
      if(!ctx){revealLuck();return}
      ctx.scale(pixelRatio,pixelRatio);
      ctx.fillStyle='#d7cbd0';ctx.fillRect(0,0,rect.width,rect.height);
      ctx.fillStyle='#a07a8d';ctx.textAlign='center';ctx.font='bold 25px sans-serif';
      ctx.fillText('여기를 긁어보세요 ✨',rect.width/2,rect.height/2+9);
      ctx.globalCompositeOperation='destination-out';ctx.lineWidth=37;ctx.lineCap='round';ctx.lineJoin='round';
      let active=false,distance=0,last=null;
      function position(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
      function move(e){
        if(!active||route.page!=='luck'||route.revealed)return;
        e.preventDefault();const v=position(e);
        if(last){ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(v.x,v.y);ctx.stroke();distance+=Math.hypot(v.x-last.x,v.y-last.y)}
        last=v;
        if(distance>rect.width*2.3)revealLuck();
      }
      canvas.addEventListener('pointerdown',e=>{active=true;last=position(e);canvas.setPointerCapture(e.pointerId)});
      canvas.addEventListener('pointermove',move);
      canvas.addEventListener('pointerup',()=>{active=false;last=null});
      canvas.addEventListener('pointercancel',()=>{active=false;last=null});
    }

        '<p>이번엔 조금 특별한 걸 선물하고 싶어서<br>엄마만의 소원상자를 만들어봤어.</p>'+
        '<p>명품도 골라보고, 여행도 떠나고,<br>100억원도 마음껏 받아봐 ㅋㅋㅋ</p>'+
        '<p>심심할 때마다 한 번씩 열어보면서<br>피식 웃을 수 있었으면 좋겠어.</p>'+
        '<p>앞으로도 재미있는 추억 많이 만들자.<br><b>사랑해 엄마! ♡</b></p><p style="font-size:13px">- 딸 -</p></div>'+
        '<div class="photo-triptych"><img src="'+PHOTO.old1+'" alt="젊은 시절 사진">'+
        '<img src="'+PHOTO.old2+'" alt="카페에서 찍은 사진">'+
        '<img src="'+PHOTO.old3+'" alt="가족과 함께한 사진"></div>'+
        '<div class="result-card"><b style="color:#8d4261">🎞️ 추억 영상</b>'+
        '<video class="video" controls preload="none" playsinline src="'+PHOTO.video+'">영상 재생을 지원하지 않는 브라우저입니다.</video></div>'+
        '<button class="btn wide" data-go="home">🎀 소원상자로 돌아가기</button>');
    }
    function animateMoney(amount){
      const label=document.getElementById('money-balance');
      if(!label)return;
      const start=performance.now(),duration=1600;
      function frame(now){
        if(!label.isConnected)return;
        const t=Math.min(1,(now-start)/duration),value=Math.floor(amount*(1-Math.pow(1-t,3)));
        label.textContent=number(value)+'원';
        if(t<1)requestAnimationFrame(frame);
        else{label.textContent=number(amount)+'원';confetti(48)}
      }
      requestAnimationFrame(frame);
    }
    function show(page,params){
      clearTimeout(flightTimer);
      route=Object.assign({page:page},params||{});
      let html='';
      switch(page){
        case 'welcome':html=renderWelcome();break;
        case 'home':html=renderHome();break;
        case 'money':html=renderMoney();break;
        case 'money-result':html=renderMoneyResult(route.amount);break;
        case 'luxury':html=renderLuxury();break;
        case 'unbox':html=renderUnbox(route.id);break;
        case 'luxury-result':html=renderLuxuryResult(route.id);break;
        case 'travel':html=renderTravel();break;
        case 'ticket':html=renderTicket(route.id);break;
        case 'flight':html=renderFlight(route.id);break;
        case 'landmark':html=renderLandmark(route.id,route.index||0);break;
        case 'photo-booth':html=renderPhotoBooth(route.id,route.index||0);break;
        case 'photo-result':html=renderPhotoResult(route.id,route.index||0,route.photo);break;
        case 'travel-done':html=renderTravelDone(route.id);break;
        case 'youth':html=renderYouth();break;
        case 'memory':html=renderMemory(route.id);break;
        case 'beauty':html=renderBeauty();break;
        case 'beauty-result':html=renderBeautyResult(route.id);break;
        case 'energy':html=renderEnergy();break;
        case 'comfort':html=renderComfort();break;
        case 'comfort-result':html=renderComfortResult(route.id);break;
        case 'luck':html=renderLuck();break;
        case 'collection':html=renderCollection();break;
        case 'clear-confirm':html=renderClearConfirm();break;
        case 'letter':html=renderLetter();break;
        default:html=renderHome();
      }
      app.innerHTML=html;
      imageFallbacks();
      window.scrollTo({top:0,behavior:'instant'});
      if(page==='money-result')animateMoney(route.amount);
      if(page==='luck')setupScratch();
      if(page==='landmark'){
        const d=findDest(route.id);loadLandmarkImage(d.places[route.index||0]);
      }
      if(page==='photo-booth'){
        const d=findDest(route.id);loadLandmarkImage(d.places[route.index||0],'photo-background');
      }
      if(page==='flight'){
        const id=route.id;
        flightTimer=setTimeout(()=>{if(route.page==='flight')show('landmark',{id:id,index:0})},2900);
      }
    }
    function handleAction(action,id,button){
      switch(action){
        case 'open-welcome':
          saved.seenWelcome=true;persist();confetti(38);show('home');break;
        case 'money-pick':{
          const amount=Number(id),label=(moneyChoices.find(x=>x.value===amount)||{}).label||number(amount)+'원';
          addGift('money',String(amount),'입금 '+label,'가상 소원 통장 · 보낸 사람 딸','💸');
          show('money-result',{amount:amount});break;
        }
        case 'luxury-pick':show('unbox',{id:id});break;
        case 'gift-open':{
          if(button.disabled)return;
          button.disabled=true;button.classList.add('opening');
          setTimeout(()=>{
            addGift('luxury',id,findProduct(id).brand+' '+findProduct(id).name,'가상 명품 선물','👜');
            show('luxury-result',{id:id});confetti(40);
          },850);
          break;
        }
        case 'dest-pick':{
          const d=findDest(id);
          addGift('ticket',id,d.flag+' '+d.name+' 항공권','가상 퍼스트클래스 항공권','🎫');
          show('ticket',{id:id});break;
        }
        case 'save-ticket':downloadTicket(id);break;
        case 'board-plane':show('flight',{id:id});break;
        case 'landmark-prev':
          show('landmark',{id:id,index:Math.max(0,(route.index||0)-1)});break;
        case 'landmark-next':
          show('landmark',{id:id,index:Math.min(findDest(id).places.length-1,(route.index||0)+1)});break;
        case 'open-photo-booth':
          show('photo-booth',{id:id,index:route.index||0});break;
        case 'capture-photo':
          if(button.disabled)return;
          button.disabled=true;
          captureTravelPhoto(id,route.index||0);break;
        case 'download-photo':
          downloadTravelPhoto(id,route.index||0,route.photo);break;
        case 'retake-photo':
          show('photo-booth',{id:id,index:route.index||0});break;
        case 'back-to-landmark':
          show('landmark',{id:id,index:route.index||0});break;
        case 'travel-finish':{
          if(!saved.stamps.includes(id))saved.stamps.push(id);
          const d=findDest(id);
          addGift('travel',id,d.flag+' '+d.name+' 여행','랜드마크 여행 완료 · 여권 도장','✈️');
          persist();show('travel-done',{id:id});confetti(46);break;
        }
        case 'memory-pick':{
          const m=MEMORIES.find(x=>x.id===id)||MEMORIES[0];
          addGift('memory',id,m.title,'도미애의 추억 사진','📸');
          show('memory',{id:id});break;
        }
        case 'beauty-pick':{
          const look=beautyLooks.find(x=>x.id===id)||beautyLooks[0];
          addGift('beauty',id,look.name+' 변신','도미애의 미모 컬렉션','👑');
          show('beauty-result',{id:id});confetti(28);break;
        }
        case 'energy-tap':{
          if(energyTaps>=3)return;
          energyTaps++;
          const pct=Math.round(energyTaps/3*100);
          document.getElementById('meter-fill').style.width=pct+'%';
          document.getElementById('energy-label').textContent='충전 중… '+pct+'%';
          document.getElementById('energy-line').textContent=['하나 충전! 🌷','두 개 충전! ✨','충전 완료! 오늘도 파이팅! 🔋'][energyTaps-1];
          button.style.transform='scale(1.12)';
          setTimeout(()=>{if(button.isConnected)button.style.transform=''},150);
          if(energyTaps===3){
            document.getElementById('energy-label').textContent='충전 완료! 100%';
            addGift('energy','full','에너지 100%','완전 충전 성공!','🔋');
            confetti(35);
          }
          break;
        }
        case 'comfort-pick':show('comfort-result',{id:id});break;
        case 'luck-reveal':revealLuck();break;
        case 'luck-again':show('luck');break;
        case 'request-clear':show('clear-confirm');break;
        case 'confirm-clear':
          clearBackup={gifts:saved.gifts.slice(),stamps:saved.stamps.slice()};
          saved.gifts=[];saved.stamps=[];persist();
          show('collection');toast('선물함을 비웠어요! 🧺');break;
        case 'undo-clear':
          if(clearBackup){
            const all=clearBackup.gifts.concat(saved.gifts);
            saved.gifts=all.filter((g,i)=>all.findIndex(x=>x.kind===g.kind&&x.key===g.key)===i).slice(0,40);
            saved.stamps=[...new Set(clearBackup.stamps.concat(saved.stamps))];
            clearBackup=null;persist();show('collection');toast('선물 기록을 되돌렸어요! 🎁');
          }
          break;
      }
    }
    app.addEventListener('click',e=>{
      const target=e.target.closest('button[data-go],button[data-action]');
      if(!target||target.disabled)return;
      const go=target.getAttribute('data-go');
      if(go){show(go);return}
      handleAction(target.getAttribute('data-action'),target.getAttribute('data-id'),target);
    });
    show(route.page);
  </script>
</body>
</html>
